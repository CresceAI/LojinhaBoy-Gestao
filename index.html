<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LojinhaBoy - Gestão Inteligente de Empréstimos</title>
    <meta name="description" content="Sistema completo de gestão de empréstimos com controle de clientes, notificações automáticas e relatórios financeiros." />
    <meta name="author" content="LojinhaBoy" />

    <!-- ✅ PWA META TAGS (corrigidas) -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LojinhaBoy" />

    <!-- ✅ Canonical e SEO -->
    <link rel="canonical" href="https://lojinhaboy.com" />

    <!-- ✅ OG Tags (otimizadas) -->
    <meta property="og:title" content="LojinhaBoy - Gestão Inteligente de Empréstimos" />
    <meta property="og:description" content="Sistema completo de gestão de empréstimos com controle de clientes, notificações automáticas e relatórios financeiros." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://lojinhaboy.com" />
    <meta property="og:site_name" content="LojinhaBoy" />

    <!-- ✅ Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LojinhaBoy - Gestão Inteligente de Empréstimos" />
    <meta name="twitter:description" content="Gestão completa de empréstimos para pequenos empreendedores." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:creator" content="@lojinhaboy" />

    <!-- ✅ PWA MANIFEST e ÍCONES -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicons otimizados -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#3b82f6" />

    <!-- ✅ Pré-carregamento crítico (performance) -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="dns-prefetch" href="//supabase.co" />

    <!-- ✅ Service Worker (melhorado) -->
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(console.warn);
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:system-ui">
        <div style="text-align:center">
          <h1 style="font-size:2rem;margin:0">⚠️ JavaScript Desabilitado</h1>
          <p style="font-size:1.1rem;margin:1rem 0">Você precisa habilitar JavaScript para usar o LojinhaBoy.</p>
        </div>
      </div>
    </noscript>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
